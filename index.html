<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChronoX | Stopwatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="stopwatch-app">

        <!-- Header -->

        <header class="app-header">

            <div class="brand">
                <div class="brand-icon">
                    ⏱
                </div>

                <div>
                    <h1>ChronoX</h1>
                    <p>Precision Stopwatch</p>
                </div>
            </div>

        </header>


        <!-- Stopwatch -->

        <section class="stopwatch-card">

            <p class="status" id="status">
                Ready to start
            </p>

            <div class="time-display" id="display">
                00:00:00
                <span id="milliseconds">.00</span>
            </div>


            <!-- Controls -->

            <div class="controls">

                <button
                    id="startBtn"
                    class="control-btn primary">
                    ▶ Start
                </button>

                <button
                    id="pauseBtn"
                    class="control-btn secondary"
                    disabled>
                    ⏸ Pause
                </button>

                <button
                    id="lapBtn"
                    class="control-btn secondary"
                    disabled>
                    🏁 Lap
                </button>

                <button
                    id="resetBtn"
                    class="control-btn reset">
                    ↻ Reset
                </button>

            </div>

        </section>


        <!-- Lap History -->

        <section class="laps-section">

            <div class="section-heading">

                <h2>Lap History</h2>

                <span id="lapCount">
                    0 Laps
                </span>

            </div>

            <div
                id="lapsContainer"
                class="laps-container">

                <div class="empty-state">
                    <div class="empty-icon">🏁</div>

                    <p>
                        Your lap times will appear here.
                    </p>
                </div>

            </div>

        </section>


        <footer>
            <p>ChronoX Stopwatch • SkillCraft Technology Internship</p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
