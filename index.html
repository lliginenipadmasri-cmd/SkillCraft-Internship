<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="app-header">

            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 11L11 13L15 9"></path>
                        <path d="M20 12A8 8 0 1 1 12 4"></path>
                    </svg>
                </div>

                <div>
                    <h1>TaskFlow</h1>
                    <p>Organize your day with clarity</p>
                </div>
            </div>

        </header>


        <!-- Add Task Section -->
        <section class="task-form-section">

            <div class="section-title">
                <p class="section-label">ADD TASK</p>

                <h2>What needs to be done?</h2>
            </div>


            <form id="taskForm">

                <div class="input-group">

                    <label for="taskInput">
                        Task
                    </label>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter your task..."
                        required>

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label for="taskDate">
                            Date
                        </label>

                        <input
                            type="date"
                            id="taskDate"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="taskTime">
                            Time
                        </label>

                        <input
                            type="time"
                            id="taskTime"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="add-task-btn">

                    <span>+</span>
                    Add Task

                </button>

            </form>

        </section>


        <!-- Task List Section -->
        <section class="tasks-section">

            <div class="tasks-header">

                <div>
                    <p class="section-label">
                        YOUR TASKS
                    </p>

                    <h2>Task List</h2>
                </div>

                <span id="taskCount">
                    0 Tasks
                </span>

            </div>


            <!-- Tasks appear here -->
            <div
                id="taskList"
                class="task-list">

                <div class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h3>No tasks yet</h3>

                    <p>
                        Add your first task to get started.
                    </p>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            TaskFlow • SkillCraft Technology Internship
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
